<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D5DFC"/>
      <stop offset="1" stop-color="#2A1A7A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDEBFF"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A59"/>
      <stop offset="1" stop-color="#FFB547"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#12083F" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- Code pane (left) -->
  <g opacity="0.95">
    <rect x="34" y="62" width="46" height="12" rx="6" fill="#B9B0FF"/>
    <rect x="46" y="88" width="58" height="12" rx="6" fill="#8FE3FF"/>
    <rect x="46" y="114" width="40" height="12" rx="6" fill="#FFFFFF" opacity="0.85"/>
    <rect x="46" y="140" width="52" height="12" rx="6" fill="#8FE3FF"/>
    <rect x="34" y="166" width="34" height="12" rx="6" fill="#B9B0FF"/>
  </g>

  <!-- Preview pane (right): a rendered component on a card -->
  <g filter="url(#shadow)">
    <rect x="124" y="46" width="100" height="164" rx="18" fill="url(#card)"/>
  </g>
  <rect x="140" y="68" width="68" height="10" rx="5" fill="#C9C3F5"/>
  <rect x="140" y="88" width="48" height="10" rx="5" fill="#DCD8FA"/>
  <rect x="140" y="146" width="68" height="36" rx="18" fill="url(#chip)"/>
  <rect x="158" y="160" width="32" height="8" rx="4" fill="#FFFFFF"/>

  <!-- Sync badge on the seam -->
  <g transform="translate(118 128)">
    <circle r="24" fill="#FFFFFF"/>
    <circle r="24" fill="none" stroke="#2A1A7A" stroke-opacity="0.12" stroke-width="2"/>
    <g fill="none" stroke="#5B4BF0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-11 -3 A12 12 0 0 1 9 -8"/>
      <path d="M11 3 A12 12 0 0 1 -9 8"/>
    </g>
    <path d="M5 -14 L12 -7 L3 -3 Z" fill="#5B4BF0"/>
    <path d="M-5 14 L-12 7 L-3 3 Z" fill="#5B4BF0"/>
  </g>
</svg>
